[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raktsetu"
version = "0.1.0"
description = "Blood request routing on e-RaktKosh stock: the Decisions API judges, code decides, an officer confirms."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
